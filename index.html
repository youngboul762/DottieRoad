<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Killadelphia's Contraband System</title>

<!-- Fonts: Oswald for headings, Rajdhani for body, Great Vibes for accents -->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rajdhani:wght@500;700;800&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #020409;
    --accent: #0b4b63;
    --accent-2: #2aa6dd;
    --text: #cfe7ee;
    --muted: #6e8a94;

    --font-body: "Rajdhani", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-heading: "Oswald", "Rajdhani", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-accent: "Great Vibes", cursive;
  }

  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 500;
    line-height: 1.4;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .page-bg{
    position:fixed; inset:0; z-index:-1;
    background:url('https://i.imgur.com/z17MUhQ.png') center/cover no-repeat;
    background-blend-mode: multiply;
    filter: blur(14px) saturate(1.05); opacity:.22;
  }

  /* Top Navigation */
  .topbar {
    position: sticky; top: 0; z-index: 1000;
    background: linear-gradient(180deg, rgba(2,4,9,0.92), rgba(2,4,9,0.98));
    border-bottom: 1px solid rgba(42,166,221,0.12);
    backdrop-filter: blur(12px);
  }
  .top-inner {
    max-width: 1280px; margin: 0 auto; padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 18px;
  }
  .brand {
    font-size: 28px;
    font-weight: 800;
    color:var(--text);
    font-family: var(--font-heading);
    display:flex; align-items:center; gap:12px;
  }
  .brand .accent {
    color: var(--accent-2);
    font-family: var(--font-accent);
    font-weight: 400;
  }

  .nav { display: flex; gap: 28px; font-size: 16px; font-weight: 600; flex: 1 1 auto; align-items:center; }
  .nav-link {
    color: #bcdbe6; text-decoration: none; position: relative; padding:6px 2px;
    transition: color .15s ease;
    font-family: var(--font-heading);
  }
  .nav-link:hover { color: var(--accent-2); }
  .nav-link.active { color: var(--text); }
  .nav-link.active::after {
    content: ''; position: absolute; bottom: -6px; left: 0;
    width: 100%; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 2px;
  }

  /* CHI logo on the right (faded) */
  .brand-logo {
    width: 56px;
    height: 56px;
    object-fit: contain;
    opacity: 0.78;
    transition: opacity .18s ease, transform .18s ease;
    filter: drop-shadow(0 8px 22px rgba(42,166,221,0.06));
    border-radius: 8px;
    background: transparent;
  }
  .brand-logo:hover { opacity: 1; transform: translateY(-2px) scale(1.02); }

  .wrap { max-width:1280px; margin: 36px auto; padding: 0 20px; }

  .main-view { display: none; padding: 30px 20px; color:var(--text); }
  .main-view.active { display: block; }

  h2 { color: var(--text); text-shadow: 0 2px 12px rgba(10,20,28,0.6); font-family:var(--font-heading); }
  p { color: var(--muted); }

  /* SNEAK PEEKS: boxed cards + glow */
  .sneak-wrapper{
    padding: 16px;
    border-radius: 10px;
    border: 1px solid rgba(42,166,221,0.06);
    box-shadow: 0 8px 40px rgba(0,0,0,0.7), 0 0 40px rgba(42,166,221,0.03) inset;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.02));
  }

  .sneak-container { display:grid; gap:20px; }

  .sneak-top { display:grid; grid-template-columns:1fr 1fr; gap:20px; }

  .card {
    background: linear-gradient(180deg, rgba(3,6,10,0.75), rgba(5,10,15,0.6));
    border-radius: 8px;
    overflow: hidden;
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.03);
    box-shadow:
      0 6px 30px rgba(0,0,0,0.7),
      0 0 0 1px rgba(42,166,221,0.02) inset;
    transition: transform .18s ease, box-shadow .18s ease;
    position: relative;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow:
      0 12px 40px rgba(0,0,0,0.75),
      0 0 30px rgba(42,166,221,0.12),
      0 0 60px rgba(42,166,221,0.06);
  }

  .card-media { height: 220px; background-size: cover; background-position: center; position: relative; }
  .card-media::after{
    content:''; position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.55));
    mix-blend-mode: multiply; pointer-events:none;
  }
  .card-media::before{
    content:''; position:absolute; inset:4px; border-radius:6px;
    box-shadow: 0 0 18px rgba(42,166,221,0.08) inset; pointer-events:none;
  }

  .card-body { padding: 14px 16px; }
  .card-title { font-family: var(--font-heading); font-weight:700; margin-bottom:8px; font-size:18px; color:var(--text); }
  .card-excerpt { color:var(--muted); font-size:13px; line-height:1.45; max-height:3.6em; overflow:hidden; text-overflow:ellipsis; }

  .card-meta { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:12px; color: rgba(207,231,238,0.75); justify-content:space-between; }
  .meta-left { display:flex; align-items:center; gap:8px; }
  .meta-left img.author-avatar { width:20px; height:20px; border-radius:50%; object-fit:cover; border:1px solid rgba(255,255,255,0.05); }
  .view-link { color: var(--accent-2); font-weight:700; text-decoration:none; font-size:13px; }

  .sneak-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:18px; margin-top:10px; }
  .small-card .card-media { height:140px; }
  .small-card .card-body { padding:12px; }
  .small-card .card-title { font-size:15px; }

  @media (max-width:980px) { .sneak-top{grid-template-columns:1fr;} .sneak-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:540px) { .sneak-grid{grid-template-columns:1fr;} .brand-logo{display:none;} }

  .badge { display:inline-block; padding:6px 10px; background: linear-gradient(90deg, rgba(11,75,99,0.9), rgba(42,166,221,0.12)); color:var(--text); border-radius:6px; font-size:13px; font-weight:700; box-shadow: 0 6px 18px rgba(42,166,221,0.04); }

  /* clock */
  .clock {
    position: fixed; right: 20px; bottom: 20px; z-index: 2000;
    background: linear-gradient(180deg, rgba(2,6,10,0.95), rgba(2,6,10,0.8));
    color: var(--text); padding: 10px 14px; border-radius: 10px;
    font-family: var(--font-body); font-size: 13px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 18px rgba(42,166,221,0.06);
    border: 1px solid rgba(42,166,221,0.06); text-align: right; min-width:150px;
  }
  .clock .time { display:block; font-weight:700; font-size:14px; }
  .clock .date { display:block; color:var(--muted); font-size:12px; margin-top:4px; }

  /* hide music UI */
  #yt-audio { width:0; height:0; overflow:hidden; position:fixed; left:-9999px; top:-9999px; pointer-events:none; }
</style>
</head>
<body>
<div class="page-bg"></div>

<div class="topbar">
  <div class="top-inner">
    <div class="brand">Killadelphia <span class="accent">Contraband</span></div>

    <nav class="nav" role="tablist" aria-label="Primary">
