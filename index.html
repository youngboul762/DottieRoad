<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Killadelphia's Contraband System</title>
<style>
  :root{
    --bg:#0b0b12;
    --panel:#121421;
    --accent:#ff6b3b;
    --accent-2:#ffb03a;
    --text:#e8e8f2;
    --muted:#94a3b8;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0; overflow-x:hidden}
  body{
    background:radial-gradient(1200px 600px at 10% -10%, rgba(255,140,64,.16), transparent 60%),
    radial-gradient(1200px 600px at 110% 10%, rgba(255,92,48,.12), transparent 60%), var(--bg);
    color:var(--text); font:500 16px/1.4 "Rajdhani", system-ui, sans-serif;
  }

  .page-bg{ position:fixed; inset:0; z-index:0; pointer-events:none;
    background:url('https://i.imgur.com/z17MUhQ.png') center/cover no-repeat fixed;
    filter: blur(14px) saturate(1.05); opacity:.22;
  }

  /* Top Navigation */
  .topbar { position: sticky; top: 0; z-index: 100; background: linear-gradient(180deg, rgba(11,11,18,0.98), rgba(11,11,18,0.92));
    border-bottom: 1px solid rgba(255,107,59,0.25); backdrop-filter: blur(12px); }
  .top-inner { max-width: 1280px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .brand { font-size: 26px; font-weight: 800; }
  .brand .accent { color: var(--accent-2); }
  .nav { display: flex; gap: 28px; font-size: 15.5px; font-weight: 600; }
  .nav-link { color: #e0e0e8; text-decoration: none; position: relative; }
  .nav-link:hover { color: var(--accent-2); }
  .nav-link.active { color: #fff; }
  .nav-link.active::after { content: ''; position: absolute; bottom: -6px; left: 0; width: 100%; height: 2px; background: var(--accent-2); }

  .purchase-btn {
    background: linear-gradient(180deg, rgba(255,107,59,0.28), rgba(255,176,58,0.08));
    color: #fff; border: 1px solid rgba(255,176,58,0.45);
    padding: 8px 18px; border-radius: 10px; font-weight: 700; cursor: pointer;
  }

  .main-view { display: none; }
  .main-view.active { display: block; }

  /* Music Player */
  .music-player {
    position: fixed; bottom: 15px; right: 15px; z-index: 200;
    background: rgba(18,20,32,0.95); border: 1px solid rgba(255,176,58,0.4);
    border-radius: 12px; padding: 8px 14px; display: flex; align-items: center; gap: 10px;
    font-size: 13px; backdrop-filter: blur(8px);
  }
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
