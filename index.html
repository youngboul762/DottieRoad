<!doctype html>
<html lang="en">
<head>

<title>Killadelphia's Contraband System</title>
<style>
  :root{
    --bg:#0b0b12;
    --accent:#ff6b3b;
    --accent-2:#ffb03a;
    --text:#e8e8f2;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0; overflow-x:hidden}
  body{
    background:radial-gradient(1200px 600px at 10% -10%, rgba(255,140,64,.16), transparent 60%),
    radial-gradient(1200px 600px at 110% 10%, rgba(255,92,48,.12), transparent 60%), var(--bg);
    color:var(--text); font:500 16px/1.4 "Rajdhani", system-ui, sans-serif;
  }

  .page-bg{ position:fixed; inset:0; z-index:0; pointer-events:none;
    background:url('https://i.imgur.com/z17MUhQ.png') center/cover no-repeat fixed;
    filter: blur(14px) saturate(1.05); opacity:.22;
  }

  /* Top Bar */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: linear-gradient(180deg, rgba(11,11,18,0.98), rgba(11,11,18,0.92));
    border-bottom: 1px solid rgba(255,107,59,0.3);
    backdrop-filter: blur(12px);
  }
  .top-inner {
    max-width: 1280px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { font-size: 26px; font-weight: 800; }
  .brand .accent { color: var(--accent-2); }

  .nav { display: flex; gap: 28px; font-size: 15.5px; font-weight: 600; }
  .nav-link {
    color: #e0e0e8; text-decoration: none; position: relative; padding-bottom: 4px;
  }
  .nav-link:hover, .nav-link.active { color: var(--accent-2); }
  .nav-link.active::after {
    content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: var(--accent-2);
  }

  .purchase-btn {
    background: linear-gradient(180deg, rgba(255,107,59,0.28), rgba(255,176,58,0.08));
    color: #fff; border: 1px solid rgba(255,176,58,0.45);
    padding: 8px 18px; border-radius: 10px; font-weight: 700; cursor: pointer;
  }

  .main-view { display: none; padding: 20px 0; }
  .main-view.active { display: block; }

  .music-player {
    position: fixed; bottom: 15px; right: 15px; z-index: 200;
    background: rgba(18,20,32,0.95); border: 1px solid rgba(255,176,58,0.4);
    border-radius: 12px; padding: 8px 14px; display: flex; align-items: center; gap: 12px;
    font-size: 13px; backdrop-filter: blur(8px);
  }
</style>

<script>

  "z4PndMZNUX8", "8e80zDhTONc", "VvItaijf80Y"
];

let currentTrack = 0;
const bgm = document.getElementById('bgmAudio');
const musicToggle = document.getElementById('musicToggle');
const nowPlaying = document.getElementById('nowPlaying');

function playTrack(index) {
  currentTrack = index % playlist.length;
  const videoId = playlist[currentTrack];
  nowPlaying.textContent = `Now Playing: Track ${currentTrack + 1}`;

  // YouTube autoplay workaround (opens embed)
  bgm.innerHTML = `<iframe width="0" height="0" src="https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}" allow="autoplay" frameborder="0"></iframe>`;
}

musicToggle.addEventListener('click', () => {
  if (bgm.innerHTML.includes('iframe')) {
    bgm.innerHTML = '';
    musicToggle.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
  } else {
    playTrack(currentTrack);
    musicToggle.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
  }
});

document.getElementById('nextTrack').addEventListener('click', () => {
  playTrack(currentTrack + 1);
});

// Try to autoplay after user interacts with the page
document.addEventListener('click', () => {
  if (!bgm.innerHTML) playTrack(0);
}, { once: true });
